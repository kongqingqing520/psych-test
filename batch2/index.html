<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#3d3a37;--mute:#8b847b;--line:#e2ddd6;--acc:#7C6C83;--acc2:#615050;}

body{margin:0;padding:0 12px 130px;background:var(--bg);color:var(--ink);

.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.intro{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13.5px;color:#585149}
.intro b{color:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;
 padding:5px 12px;font-size:12.5px}
.chip.done{border-color:var(--acc);color:var(--acc);font-weight:600}
h2{font-size:16.5px;margin:30px 0 4px;color:var(--acc2);border-left:4px solid var(--acc);padding-left:9px}
h2 .n{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
.note{font-size:12.5px;color:var(--mute);margin:4px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mute);margin:6px 0 10px}
.legend span{white-space:nowrap}
.item{background:var(--card);border-radius:10px;padding:11px 12px 9px;margin:8px 0;
 box-shadow:0 1px 2px rgba(80,70,60,.06)}
.qt{font-size:14.5px;margin-bottom:9px;color:#332f2b}
.qt i{color:var(--acc);font-style:normal;font-size:12px;margin-right:5px}
.opts{display:flex;gap:5px}
.opt{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 0;

.opt.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
input.fill{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;
 color:#332f2b;background:#fcfbf9;font-family:inherit}
input.fill:focus{outline:none;border-color:var(--acc);background:#fff}
textarea.fill{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;
 font-size:14px;color:#332f2b;background:#fcfbf9;font-family:inherit;line-height:1.55;resize:vertical}
textarea.fill:focus{outline:none;border-color:var(--acc);background:#fff}
.hint{font-size:11.5px;color:#b3aca2;margin-top:5px}
#bar{position:fixed;left:0;right:0;top:0;height:4px;background:transparent;z-index:9}
#bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#foot{position:fixed;left:0;right:0;bottom:0;background:rgba(244,242,239,.96);
 border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:9}
#foot .st{font-size:12px;color:var(--mute);text-align:center;margin-bottom:7px}
button.main{width:100%;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;
 padding:12px;font-weight:600}
button.mini{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;
 padding:6px 12px;color:var(--acc2);margin:4px 6px 4px 0}
#result{display:none;background:var(--card);border-radius:12px;padding:14px;margin-top:20px;
 box-shadow:0 1px 3px rgba(80,70,60,.1)}
#result h3{color:var(--acc2);font-size:15px;margin:16px 0 4px}
#result h3:first-child{margin-top:0}
textarea#out{width:100%;height:300px;border:1px solid var(--line);border-radius:8px;padding:10px;
 font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;color:#33302c;background:#faf8f5}
.small{font-size:12px;color:var(--mute);margin:8px 0}
.sc{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sc b{color:var(--acc2);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px;
 background:#efe9e4;color:#7b7268}
.tag.warn{background:#f3e0da;color:#A85A4A}
.tag.ok{background:#e3ece4;color:#4a7a55}
</style>
</head>

/* 自我探索测评 · 交互与计分（app2.js） */
const state = {};
const app = document.getElementById('app');
const key = (si,ii,k)=>si+':'+ii+':'+k;
const val = (si,ii,k)=>state[key(si,ii,k)];
const LK = DATA.scales.filter(s=>s.kind==='likert');
const total = LK.reduce((a,s)=>a+s.items.reduce((b,it)=>b+it.slots.length,0),0);
const nOpen = DATA.scales.filter(s=>s.kind!=='likert').reduce((a,s)=>a+s.items.length,0);
document.getElementById('totQ').textContent = total;
document.getElementById('introText').innerHTML =
  DATA.scales.map(s=>s.name+'（'+s.items.length+'）').join('　·　') +
  '<br><span style="color:#8b847b">全部免费、无广告、不上传——答案只留在你这台手机上。</span>' +
  '<br><span style="color:#8b847b;font-size:12px">' + DATA.footnote + '</span>';

/* ---- chips ---- */
const chips = document.getElementById('chips');
DATA.scales.forEach((s,si)=>{
  const c=document.createElement('div');c.className='chip';c.textContent=s.name;
  c.onclick=()=>document.getElementById('sec'+si).scrollIntoView({behavior:'smooth'});
  chips.appendChild(c);
});

/* ---- 渲染 ---- */
function likertRow(box, si, ii, k, opts, min, max){
  const o=document.createElement('div');o.className='opts';
  for(let v=min;v<=max;v++){
    const b=document.createElement('div');b.className='opt';b.textContent=v;
    b.onclick=()=>{state[key(si,ii,k)]=v;
      [...o.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');upd();};
    o.appendChild(b);
  }
  box.appendChild(o);
}
function qt(box, n, text, small){
  const q=document.createElement('div');q.className='qt';
  if(small)q.style.cssText='font-size:13.5px;color:#5b554e;margin:8px 0 6px';
  q.innerHTML='<i>'+n+'</i>';
  q.appendChild(document.createTextNode(text));
  box.appendChild(q);
}

DATA.scales.forEach((s,si)=>{
  const h=document.createElement('h2');h.id='sec'+si;
  h.innerHTML=s.name+' <span class="n">'+s.items.length+'</span>';
  app.appendChild(h);
  const n=document.createElement('div');n.className='note';
  n.textContent=(s.intro||'')+(s.note?'  '+s.note:'');
  app.appendChild(n);
  if(s.kind==='likert'){
    const lg=document.createElement('div');lg.className='legend';
    lg.innerHTML=s.options.map((o,i)=>'<span>'+(i+s.min)+'＝'+o+'</span>').join('')+
      '<span style="color:#b3aca2">（点数字选择）</span>';
    app.appendChild(lg);
  }
  s.items.forEach((it,ii)=>{
    const d=document.createElement('div');d.className='item';
    if(s.kind==='likert' && it.slots.length===1){
      qt(d,(ii+1)+'.',it.slots[0].t,false);
      likertRow(d,si,ii,0,s.options,s.min,s.max);
    } else if(s.kind==='likert'){
      qt(d,(ii+1)+'.',it.label,false);
      it.slots.forEach((sl,k)=>{
        qt(d,'①②③'.charAt(k),sl.t,true);
        likertRow(d,si,ii,k,s.options,s.min,s.max);
      });
    } else if(s.kind==='text'){
      qt(d,(ii+1)+'.',it.slots[0].t,false);
      const ip=document.createElement('input');ip.className='fill';ip.type='text';
      ip.oninput=()=>{state[key(si,ii,0)]=ip.value;upd();};
      d.appendChild(ip);
      const hh=document.createElement('div');hh.className='hint';hh.textContent='凭第一反应写完，不回改';
      d.appendChild(hh);
    } else {
      qt(d,(ii+1)+'.',it.slots[0].t,false);
      const ta=document.createElement('textarea');ta.className='fill';
      ta.oninput=()=>{state[key(si,ii,0)]=ta.value;upd();};
      d.appendChild(ta);
    }
    app.appendChild(d);
  });
});

/* ---- 进度 ---- */
function lkDone(si){
  const s=DATA.scales[si];let c=0,t=0;
  s.items.forEach((it,ii)=>it.slots.forEach((sl,k)=>{
    t++; if(state[key(si,ii,k)]!=null)c++;
  }));
  return [c,t];
}
function openDone(si){
  const s=DATA.scales[si];let c=0;
  s.items.forEach((it,ii)=>{const v=state[key(si,ii,0)];if(v&&v.trim())c++;});
  return c;
}
function openAll(){let c=0;DATA.scales.forEach((s,si)=>{if(s.kind!=='likert')c+=openDone(si);});return c;}
function upd(){
  let done=0;
  DATA.scales.forEach((s,si)=>{if(s.kind==='likert')done+=lkDone(si)[0];});
  document.getElementById('stat').textContent=
    '量表 已答 '+done+' / '+total+'　·　开放题 已写 '+openAll()+' / '+nOpen;
  document.querySelector('#bar>i').style.width=(done/total*100)+'%';
  [...chips.children].forEach((c,si)=>{
    const s=DATA.scales[si];
    c.classList.toggle('done', s.kind==='likert' && lkDone(si)[0]===lkDone(si)[1]);
  });
}
upd();

/* ---- 计分 ---- */
const r2 = x=>Math.round(x*100)/100;

function scoreScale(si){
  const s=DATA.scales[si], o={rows:[],txt:[]};
  if(s.score==='asrs'){
    let hits=0,sum=0; const dim={};
    s.items.forEach((it,ii)=>{
      const v=val(si,ii,0), vv=(v==null?0:v); sum+=vv;
      const hit = vv>=it.slots[0].thr ? 1:0; hits+=hit;
      const dn=it.slots[0].dim;
      if(!dim[dn])dim[dn]=[0,0]; dim[dn][0]+=hit; dim[dn][1]++;
    });
    const pos = hits>=DATA.meta.asrsCut;
    o.rows.push({l:'暗影区命中', v:hits+' / '+s.items.length, t:pos?'筛查阳性':'筛查阴性'});
    o.rows.push({l:'0–24 合计', v:sum+' / 24', t:sum>=14?'≥14':'—'});
    Object.keys(dim).forEach(k=>o.rows.push({l:k, v:dim[k][0]+' / '+dim[k][1]+' 命中', t:''}));
    o.txt.push('暗影区命中：'+hits+' / '+s.items.length+' → '+(pos?'筛查阳性':'筛查阴性')+'（阈值 ≥4）');
    o.txt.push('0–24 合计：'+sum+'（备用口径 ≥14 为阳性）');
    Object.keys(dim).forEach(k=>o.txt.push('  '+k+'：'+dim[k][0]+' / '+dim[k][1]+' 命中'));
  }
  else if(s.score==='pss'){
    let sum=0; const dm={};
    s.items.forEach((it,ii)=>{
      let v=val(si,ii,0); v=(v==null?0:v);
      if(it.slots[0].rev)v=4-v;
      sum+=v; const d=it.slots[0].dim; (dm[d]=dm[d]||[]).push(v);
    });
    const band = sum<=13?'低':(sum<=26?'中':'高');
    o.rows.push({l:'总分', v:sum+' / 40', t:band});
    Object.keys(dm).forEach(k=>o.rows.push({l:k, v:dm[k].reduce((a,b)=>a+b,0)+' 分', t:dm[k].length+' 题'}));
    o.txt.push('总分：'+sum+' / 40（'+band+'；0–13 低 / 14–26 中 / 27–40 高，非严格常模）');
    Object.keys(dm).forEach(k=>o.txt.push('  '+k+'：'+dm[k].reduce((a,b)=>a+b,0)+'（'+dm[k].length+' 题）'));
  }
  else if(s.score==='ders'){
    let sum=0; const dm={};
    s.items.forEach((it,ii)=>{
      const v=val(si,ii,0)||0; sum+=v;
      const d=it.slots[0].dim; (dm[d]=dm[d]||[]).push(v);
    });
    o.rows.push({l:'总分', v:sum+' / 80', t:'越高越困难'});
    Object.keys(dm).forEach(k=>o.rows.push({l:k, v:dm[k].reduce((a,b)=>a+b,0)+' 分', t:dm[k].length+' 题'}));
    o.txt.push('总分：'+sum+' / 80（越高表示情绪调节越困难；无官方临床切点）');
    Object.keys(dm).forEach(k=>o.txt.push('  '+k+'：'+dm[k].reduce((a,b)=>a+b,0)+'（'+dm[k].length+' 题）'));
  }
  else if(s.score==='via'){
    const arr=s.items.map((it,ii)=>{
      const a=val(si,ii,0)||0, b=val(si,ii,1)||0;
      return {l:it.label, vt:it.virtue, v:a+(6-b)};
    });
    const sorted=[...arr].sort((x,y)=>y.v-x.v);
    sorted.slice(0,5).forEach((x,i)=>o.rows.push({l:'Top'+(i+1)+'　'+x.l, v:x.v+' / 10', t:x.vt}));
    o.txt.push('标志性优势 Top 5：'+sorted.slice(0,5).map(x=>x.l+'（'+x.v+'/10）').join('　'));
    arr.forEach(x=>o.txt.push('  '+x.l+'（'+x.vt+'）：'+x.v+' / 10'));
    const virt={}; arr.forEach(x=>{(virt[x.vt]=virt[x.vt]||[]).push(x.v);});
    o.txt.push('美德均值：'+Object.keys(virt).map(k=>k+' '+r2(virt[k].reduce((a,b)=>a+b,0)/virt[k].length)).join('　'));
  }
  return o;
}

/* ---- 出结果 ---- */
document.getElementById('go').onclick=()=>{
  let miss=[];
  DATA.scales.forEach((s,si)=>{if(s.kind==='likert'){const [c,t]=lkDone(si);if(c<t)miss.push(s.name+'（还差 '+(t-c)+'）');}});
  let txt='=== 自我探索测评 · 结果 ===\n';
  let html='<h3>结果</h3>';
  if(miss.length)html+='<div class="small" style="color:#A85A4A">未答完：'+miss.join('；')+'。下面只按已答的部分算。</div>';
  else html+='<div class="small" style="color:#4a7a55">量表已全部答完。</div>';

  DATA.scales.forEach((s,si)=>{
    if(s.kind==='likert'){
      const sc=scoreScale(si);
      txt+='\n['+s.name+']\n'+sc.txt.join('\n')+'\n';
      html+='<h3>'+s.name+'</h3>';
      sc.rows.forEach(r=>{
        html+='<div class="sc"><span>'+r.l+(r.t?' <span class="tag">'+r.t+'</span>':'')+'</span><b>'+r.v+'</b></div>';
      });
    } else {
      txt+='\n['+s.name+'　开放题原文]\n';
      s.items.forEach((it,ii)=>{
        const v=val(si,ii,0)||'';
        txt+=(ii+1)+'. '+it.slots[0].t+'\n   → '+(v||'（未作答）')+'\n';
      });
      html+='<h3>'+s.name+'</h3><div class="small">开放题原文已放进下面的结果文本里，这里不重复显示。</div>';
    }
  });

  let raw='RAW|';
  DATA.scales.forEach((s,si)=>{
    if(s.kind!=='likert')return;
    raw+=s.key+':';
    s.items.forEach((it,ii)=>it.slots.forEach((sl,k)=>{
      const v=state[key(si,ii,k)];
      raw+=(v==null?'x':v)+',';
    }));
    raw+='|';
  });
  txt+='\n'+raw+'\n';

  const res=document.getElementById('result');
  html+='<div class="small">下面这段已含全部结果与开放题原文，点栏内全选复制，粘回聊天即可：</div>'+
        '<textarea id="out" readonly></textarea>'+
        '<button class="main" style="margin-top:10px" id="cp">全选这段结果</button>';
  res.style.display='block';res.innerHTML=html;
  const out=document.getElementById('out');
  out.value=txt;
  out.style.height=Math.min(420,Math.max(240,txt.split('\n').length*15))+'px';
  document.getElementById('cp').onclick=()=>{
    out.focus();out.setSelectionRange(0,out.value.length);
    try{document.execCommand('copy');}catch(e){}
    document.getElementById('cp').textContent='已选中（如未复制请长按选择）';
  };
  res.scrollIntoView({behavior:'smooth'});
};

</script>
