const state = {};            // "scale:index" -> value
const app = document.getElementById('app');
const subOrder = (s)=>{const o=[];s.items.forEach(it=>{if(o.indexOf(it.sub)<0)o.push(it.sub)});return o;};
const total = DATA.scales.reduce((a,s)=>a+s.items.length,0);
document.getElementById('totQ').textContent = total;
document.getElementById('introText').innerHTML =
  DATA.scales.map(s=>s.name+'（'+s.items.length+'题）').join('　·　') +
  '<br><span style="color:#8b847b">全部免费、无广告、不上传任何数据——答案只留在你这台手机上。</span>' +
  '<br><br><span style="color:#8b847b;font-size:12px">说明：HEXACO 与 IPIP 用的是官方/公开中文题本；SD3 与 ECR-R 的英文题目取自原作者版本，中文为本页工作译本，未采用公开发表的中文修订版。四套结果都只作自我观察，不是诊断，也不替代专业评估。</span>';

// build items

  lg.innerHTML=s.options.map((o,i)=>'<span>'+ (i+1) +'＝'+o+'</span>').join('')+'<span style="color:#b3aca2">（点击数字选择）</span>';
  app.appendChild(lg);
  s.items.forEach((it,ii)=>{
    const d=document.createElement('div');d.className='item';
    const q=document.createElement('div');q.className='qt';q.textContent=(ii+1)+'. '+it.t;d.appendChild(q);
    const o=document.createElement('div');o.className='opts';
    for(let v=s.min;v<=s.max;v++){
      const b=document.createElement('div');b.className='opt';b.textContent=v;
      b.onclick=()=>{state[si+':'+ii]=v;
        [...o.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');upd();};
      o.appendChild(b);
    }
    d.appendChild(o);app.appendChild(d);

function scaleDone(si){const s=DATA.scales[si];let c=0;for(let i=0;i<s.items.length;i++)if(state[si+':'+i])c++;return c;}
function upd(){
  let done=0;DATA.scales.forEach((s,si)=>{done+=scaleDone(si);});
  document.getElementById('stat').textContent='已答 '+done+' / '+total;
  document.querySelector('#bar>i').style.width=(done/total*100)+'%';
  [...chips.children].forEach((c,si)=>{c.classList.toggle('done',scaleDone(si)===DATA.scales[si].items.length);});
}

function r2(x){return Math.round(x*100)/100;}
function get(si,i){const v=state[si+':'+i];return v?v:null;}

function computeScale(si){
  const s=DATA.scales[si],out={domains:[],facets:[],answered:scaleDone(si)};
  if(s.score==='mean'){
    const m={};s.items.forEach((it,i)=>{let v=get(si,i);if(v==null)return;if(it.rev)v=s.min+s.max-v;
      (m[it.sub]=m[it.sub]||[]).push(v);});
    subOrder(s).forEach(k=>{const a=m[k];if(!a)return;out.domains.push({label:s.subNames[k]||k,val:r2(a.reduce((x,y)=>x+y,0)/a.length),n:a.length,scale:'1–'+s.max});});
  } else { // IPIP sum4
    const dm={},fm={};
    subOrder(s).forEach(k=>dm[k]=[]);
    s.items.forEach((it,i)=>{let v=get(si,i);if(v==null)return;if(it.rev)v=6-v;dm[it.sub].push(v);
      (fm[it.facet]=fm[it.facet]||[]).push(v);});
    subOrder(s).forEach(k=>{const a=dm[k];if(!a.length)return;
      out.domains.push({label:s.subNames[k]||k,val:a.reduce((x,y)=>x+y,0),n:a.length,scale:'24–120'});});
    Object.keys(fm).sort().forEach(f=>{
      const a=fm[f];const dom=f[0];const num=parseInt(f.slice(1),10);
      const nm=(s.facetNames&&s.facetNames[dom])?s.facetNames[dom][num-1]:f;
      out.facets.push({label:s.subNames[dom]+'·'+nm,val:a.reduce((x,y)=>x+y,0),n:a.length,scale:'4–20'});});
  }
  return out;
}

document.getElementById('go').onclick=()=>{
  let missing=[];
  DATA.scales.forEach((s,si)=>{if(scaleDone(si)<s.items.length)missing.push(s.name+'（还差'+(s.items.length-scaleDone(si))+'题）');});
  const res=document.getElementById('result');
  let html='<h3>结果</h3>';
  if(missing.length)html+='<div class="small" style="color:#A85A4A">未答完：'+missing.join('；')+'。下面只按已答的部分算。</div>';
  let txt='=== 人格测评结果 ===\n';
  const names={};
  DATA.scales.forEach((s,si)=>{
    const c=computeScale(si);names[s.key]=c;
    txt+='\n['+s.name+'] 已答 '+c.answered+'/'+s.items.length+'\n';
    if(s.note)txt+='（计分：'+s.note+'）\n';
    c.domains.forEach(d=>{txt+=d.label+'：'+d.val+'  ('+d.n+'题, '+d.scale+')\n';});
    if(c.facets.length){txt+='  — 侧面 —\n';
      c.facets.forEach(f=>{txt+='  '+f.label+'：'+f.val+'\n';});}
    html+='<h3>'+s.name+'</h3>';
    c.domains.forEach(d=>{html+='<div class="sc"><span>'+d.label+'</span><b>'+d.val+' <span style="color:#a39b91;font-weight:400">/'+d.scale+'</span></b></div>';});
  });
  // raw answers line
  let raw='RAW|';
  DATA.scales.forEach((s,si)=>{raw+=s.key+':';for(let i=0;i<s.items.length;i++){raw+=(state[si+':'+i]||0);}raw+='|';});
  txt+='\n'+raw+'\n';
  html+='<div class="small">下面这段文字已包含全部结果，点一下全选，复制后粘回聊天即可：</div>'+
        '<textarea id="out" readonly>'+txt+'</textarea>'+
        '<button class="main" style="margin-top:10px" id="cp">全选这段结果</button>';
  res.style.display='block';res.innerHTML=html;
  const out=document.getElementById('out');
  document.getElementById('cp').onclick=()=>{out.focus();out.setSelectionRange(0,out.value.length);try{document.execCommand('copy');}catch(e){}
    document.getElementById('cp').textContent='已选中（如未复制请长按选择）';};
  res.scrollIntoView({behavior:'smooth'});
};
